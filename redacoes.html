                theme: "O respeito às diferenças para a superação dos conflitos sociais na sociedade contemporânea",
                score: "Nota: 680.0",
                numericScore: 680.0,
                text: `Nos dias atuais, vivemos em uma sociedade no qual pessoas sofrem com preconceito, intolerância, desigualdade, desrespeito, isso vem junto com a perda de ética das pessoas e isso é um grande ponto negativo para uma convivência saudável. Por isso, temos que respeitarmos a diferença e não criticá-los, usar essas críticas para uma superação maior que elas.

Com isso, a falta de ética dentro da nossa sociedade pode aumentar os conflitos. Os preconceitos também podem levar a uma exclusão social, violência e danos físicos e mentais para as pessoas que sofrem com isso. Um dos pontos em que ocorrem constantemente esses tipos de conflitos são as redes sociais.

A ética e o respeito é fundamental para mudarmos e superarmos esses conflitos, mostrando para a sociedade a diferença radical que trás, para que assim possamos viver em igualdade e sem problemas. Uma iniciativa que pode ser tomada para aumentar o respeito na sociedade, seja as escolas fazendo trabalhos escolares abordando o tema, campanhas sociais e até mesmo publicando postagens para as redes sociais, pois assim alcançamos o nosso objetivo com mais eficiência.

Entende-se que o respeito e a ética são importantes para superar esses conflitos, porém não é algo fácil de conseguir, mas podemos criar alternativas para resolver isso e assim vivemos em uma sociedade igualitária.`

            {

                score: "Nota: 400.0",
                numericScore: 400.0,
                text: `Quando o assunto se retrata sobre os Povos Originários, muitas pessoas tem pensamento crítico no qual o consideram como "seres que não devem convivir nas cidades", mostrando que esses povos tentam a necessidade de aceitação da sociedade para viver dentro dela. Povos assim precisam ser valorizados por conta de sua história no passado, provando que eles conquistaram direitos para estar incluso na sociedade.

A história desses Povos Originários não se retrata de agora, eles estão desde o começo, na criação do nosso país, trazendo um marco importante para o Brasil. Com o avanço da população, esses povos ficaram cada vez mais isolados, fora da urbanização, o que resultou em raridade e medo na tentativa de se associar com nós. Mas basta entendermos que assim como todos os cidadãos, os Povos Originários também tem seus direitos, isso é provado na Constituição Federal de 1988, no qual se retrata sobre a valorização e reconhecimento deles na sociedade.

O escritor Daniel Munduruku aborda sobre a importância de valorizar o pensamento originário e a ancestralidade para combater preconceitos. Os Povos Originários devem ser aceitos e valorizados na sociedade brasileira, sem haver nenhum tipo de preconceito.

Uma intervenção para isso é necessário uma ação do Governo da parte do Ministério da Educação, no qual implementa nas Escolas assuntos sobre os Povos Originários, através de aulas, trabalhos e projetos para os alunos, mostrando a eles o porquê devem ser valorizados e ter seus direitos. Dessa forma, os Povos Originários terão a liberdade de conviver com nós e entendermos que todos temos direitos e deveres a serem cumpridos.`
            },
            {

                numericScore: 680.0,
                text: `Os eventos de enchentes que ocorreram nesses últimos anos causaram impactos sociais e econômicos, resultando em mudanças no ciclo ecológico. O estado do Rio Grande do Sul foi vítima dessa catástrofe, tendo um imenso impacto negativo ocasionando morte de pessoas, perca de recursos, abalando psicológicos e entre outras coisas. Esse evento afetou negativamente o estado e tudo isso pode ter sido principalmente causado pela população, por não ter um processo de educação sobre reciclagem educativa.

A região Sudeste principalmente no estado de Minas Gerais, também sofreram com esses eventos catastróficos, ocasionando os mesmos resultados das enchentes do Rio Grande do Sul. Outra matéria do G1 cita novamente que a má reciclagem é um dos principais culpados desses eventos. Reforçando novamente a ideia de que seja indispensável uma atitude dos Governos sobre o assunto, mostrando a população o impacto e a importância de uma reciclagem sustentável.

Contudo, as enchentes afetam diretamente nos pontos sociais e econômicos, ocorrendo mudanças no ciclo ecológico, mas com uma iniciativa dos Governos e levando para a Educação a importância da reciclagem, ocasionando mudanças positivas no ciclo ecológico.`
            },
            {

                score: "Nota: 800.0",

                text: `Segundo pesquisas da matéria publicada pelo G1, mostram que essas tais Canetas Emagrecedoras causaram impactos negativos à saúde das pessoas que fizeram o uso do medicamento, levando a consultarem especialistas e chegarem no mesmo resultado, dizendo que o uso não controlado das Canetas Emagrecedoras é prejudicial à saúde. Atualmente as pessoas procura métodos para estarem esteticamente dentro dos "padrões" de beleza contemporânea, mas essas escolhas vem principalmente da pressão da sociedade e da falta de autoestima. Essa pressão que a sociedade causa pode facilmente mudar o pensamento da pessoa que está sofrendo, fazendo ela pensar que não se encaixa dentro do grupo social atual por não ter o "padrão" de beleza ideal, afetando psicologicamente o que leva essa pessoa a usar esses tais métodos, sendo um deles o uso das Canetas Emagrecedoras.

A falta de autoestima é um problema mental que é desenvolvido principalmente pela comparação, perceber que a pessoa é diferente e que não está no "padrão" ideal, não se aceitando do jeito que é, resultando também na busca de métodos de mudança.

O filme "Extraordinário" de 2017, conta a história de um menino que nasceu com uma condição rara chamada Síndrome de Treacher Collins, ocasionando na má formação de genética o que resultou na deformidade no qual o menino tinha, ao longo do filme percebemos que ele sofreu uma pressão de alunos da sua escola e também desenvolveu a falta de autoestima, fazendo com que ele pensasse como seria se ele não tivesse aquilo, no fim ele percebeu que era melhor ele apenas se aceitar do jeito que era do que ir atrás de métodos arriscados que poderiam afetar drasticamente a sua saúde.

Com tudo, o uso das Canetas Emagrecedoras é ruim para a saúde e não vale a pena usá-lo para apenas para tentar se encaixar no "padrão", a melhor forma é encontrar outros métodos seguros indicados por profissionais e priorizar o equilíbrio mental para não se abalar com a pressão da sociedade.`

            {

                score: "Nota: 600.0",
                numericScore: 600.0,
                text: `De acordo com o jornal G1 uma matéria publicada no ano de 2025, pesquisas apontam que casos de Migrantes aumentaram em 42% desde o ano de 2021 no Brasil, porém muitos relatam que não se sentem acolhidos dentro da sociedade, passando por constantes desafios. Com isso, notamos que esses indivíduos tendem a continuar sofrendo com o passar dos anos, isso se dá por conta da falta de inclusão social entre a população e a escassez dos direitos como cidadãos.

A população necessita de uma convivência agradável para continuarmos evoluindo, porém infelizmente muitos Imigrantes não se sentem confortável no ambiente civil e isso se dá pela ausência da inclusão social, através de preconceitos e impressões negativas sobre eles, o que se torna impossível a possibilidade de um convívio harmônico para todos.

Conforme a "Declaração Universal dos Direitos Humanos", no qual é dividido em 30 artigos e serve para garantir a dignidade, liberdade e justiça a todas as pessoas, destaca sobre a importância desses princípios para um cidadão, mostrando que todos tem seus privilégios como pessoa. Os migrantes sofrem com a falta dessas garantias, mostrando que esses indivíduos não conseguem ter uma rotina agradável com outras pessoas.

Com tudo, a sociedade brasileira necessita ser mais empática, fazendo com que esses migrantes se sintam confortáveis, com providências do Governo da parte do Ministério dos Direitos Humanos e da Cidadania, aprimorando Leis e reforçando a importância delas, não só isso, mas também garantir qualidade de vida para todos e assim combater essa desigualdade social.`
            },
            {
                theme: "O lado negativo das IA e as Deepfakes",
                score: "Nota: 800.0",
                numericScore: 800.0,
                text: `Segundo pesquisas da matéria publicada pelo G1, mostram que atualmente o uso da IA vem crescendo bastante dentro da nossa sociedade, porém ela está sendo usada de maneira negativa, causando más impressões sobre ela, sendo utilizada para criar vídeos, notícias, imagens e informações falsas, não só isso como também aplicando a IA para passar golpes nas pessoas. A plataforma TikTok é o maior alvo de postagens falsas, um exemplo foi um vídeo publicado em setembro no ano de 2025, no qual mostrava um canguru dentro de um aeroporto, mas na verdade todo aquele cenário era falso. Outra plataforma que é afetada pelos famosos "golpes" é o Whatsapp, um exemplo dado foi na reportagem do Jornal Nacional no quadro Fato ou Fake publicada no ano de 2024, no qual mostravam os golpes sendo aplicados através de áudios falsos, gerados por IA, para enganar a vítima. Para a plataforma TikTok, é necessário uma supervisão melhor e cuidados nas postagens, como aquele exemplo dado, tomem restrições ou permissão de publicar, mas sem afetar os espectadores.

A plataforma Whatsapp está no ar a mais de uma década, mas sempre foi afetada por golpistas e agora com o uso da IA facilitou ainda mais com a criação de situações, falas e áudios falsos. Problemas como esses, devem receber suporte e avisos da plataforma para que os usuários tomem cuidados e não correrem a este risco.

O filme "Her" lançado no ano de 2013, relata a história de um homem solitário que desenvolveu uma relação amorosa com uma máquina, ou como chamamos a IA, nesse contexto, notamos que o avanço dela foi tão grande que ela consegue cumprir o que pedimos sem muita dificuldade. O filme mostra como é a capacidade da IA, mas existem pessoas que infelizmente usam ela de maneira negativa e afetando a nossa sociedade.

O uso da IA é necessário no nosso dia-a-dia, mas em mãos erradas podem impactar negativamente muitas pessoas, porém basta cuidado, melhoria no suporte, denúncias de ocorrências fora do comum e restrições para que assim ela fique adaptada para a nossa sociedade contemporânea.`

            {

                text: `Nos últimos anos, o setor da agropecuária no Brasil, se tornou muito eficiente com o passar dos anos, um serviço que feito com dificuldades, acabou sendo facilitado utilizando as tecnologias modernas, mas com o uso inadequado dessas ferramentas podem na produção, transformando em uma situação não sustentável. Na matéria do jornal G1 publicada no ano de 2024, relatam sobre a importância de projetos sustentáveis para a área da agropecuária e mostrando que simples mudanças, causam grandes impactos positivos.

Outro fator importante é a falta de implementação de projetos sustentáveis dentro da área, a agropecuária que trabalha com um dos principais fatores que movem a economia do país. Ao aplicarmos esses projetos, poderemos ver que eles trazem resultados mais sustentáveis e benéficos para a sociedade.

A tecnologia moderna dentro da agropecuária é fundamental para o funcionamento dela, mas deve ser aplicada com moderação, fazendo com que não criem problemas futuramente, também é importante não descartar projetos sustentáveis, mas sim implementá-los mais vezes dentro da área, para termos resultados positivos e não prejudiciais para a sociedade.`

            {

                text: `Na sociedade atual, o uso das tecnologias, tais como redes sociais e IA vem facilitando cotidiano, quebrando as dificuldades que pessoas tinham, porém infelizmente muitas pessoas não tem acesso a esses benefícios, motivos como a falta de inclusão social, a pessoa não saber mexer, pesquisas da manchete do Jornal Nacional publicada no ano de 2025, mostra que quatorze por cento da população brasileira não sabem como acessar as mídias digitais. Por outro lado, vemos também pessoas que não tem o acesso por falta de recursos, onde a tecnologia infelizmente é precária.

            {

                text: `Jovens estão apostando o seu dinheiro que é utilizado para pagamento de contas em sites de apostas ou nas famosas "bets", deixando eles em dívidas que acabam sendo altas. De acordo com o jornal G1, em uma matéria publicada no ano de 2026, no qual mostra que os jovens estão acessando cada vez mais sites de apostas, o que acaba resultando em um vício descontrolado, usando CPF de maiores de idade para ter mais acessos no cotidiano, burlando o sistema e aumentando a irresponsabilidade desses jovens.

No Brasil, quarenta por cento dos jovens já estão ingressados no mercado de trabalho, na maioria das vezes para ganhar o salário e pagar as contas da faculdade, cursos ou até mesmo contas pessoais, o problema é que com o mal controle financeiro eles acabam apostando esse dinheiro em bets, o que resulta em dívidas. Os colégios tem o dever de ensinar sobre esse assunto para os alunos, mostrando a eles a importância de uma boa gestão financeira e como esses sites de apostas podem endividar você rapidamente sem perceber.

O vício é um problema grave que é difícil de ser controlado, podendo afetar o indivíduo negativamente, com as bets não é diferente, chegando ao ponto de vincularem contas de outras pessoas ou até mesmo dos responsáveis e familiares para burlarem os sites e apostarem mais. Essas bets tem que ter um suporte melhor, para impedir o acesso limitado do indivíduo, colocando até mesmo a identificação do rosto, para ver se a pessoa está fazendo acessos múltiplos no dia e impedir esses acessos.

        document.addEventListener("DOMContentLoaded", () => {
            const essayGrid = document.getElementById("essayGrid");
            const essaySearch = document.getElementById("essaySearch");
            const sortButtons = document.querySelectorAll(".sort-btn");

            const modal = document.getElementById("essayModal");
            const modalNumber = document.getElementById("modalNumber");
            const modalScore = document.getElementById("modalScore");
            const modalTitle = document.getElementById("modalTitle");
            const modalText = document.getElementById("modalText");
            const modalClose = document.getElementById("modalClose");

            let currentSort = "default";

            if (!essayGrid) return;

            function openModal(essay, index) {
                if (modalNumber) modalNumber.textContent = `REDAÇÃO ${String(index + 1).padStart(2, "0")}`;
                if (modalScore) modalScore.textContent = essay.score;
                modalTitle.textContent = essay.theme;
                modalText.textContent = essay.text;
                modal.classList.add("active");
                modal.setAttribute("aria-hidden", "false");
            }

            function closeModal() {
                modal.classList.remove("active");
                modal.setAttribute("aria-hidden", "true");
            }

            function renderEssays(search = "", sortType = "default") {
                essayGrid.innerHTML = "";
                const termo = search.trim().toLowerCase();
                
                // Filtra pelo termo de busca
                let filtered = essays.filter(essay => essay.theme.toLowerCase().includes(termo));

                // Faz uma cópia para não alterar a ordem original do array global
                let result = [...filtered];

                // Aplica a ordenação escolhida
                if (sortType === "alpha") {
                    result.sort((a, b) => a.theme.localeCompare(b.theme));
                } else if (sortType === "score-asc") {
                    result.sort((a, b) => a.numericScore - b.numericScore);
                } else if (sortType === "score-desc") {
                    result.sort((a, b) => b.numericScore - a.numericScore);
                }
                // Se for "default", mantém a ordem original do vetor

                if (result.length === 0) {
                    essayGrid.innerHTML = '<p class="empty-message">Nenhuma redação encontrada.</p>';
                    return;
                }

                result.forEach(essay => {
                    const originalIndex = essays.indexOf(essay);
                    const card = document.createElement("article");
                    card.className = "essay-card";
                    card.tabIndex = 0;
                    card.setAttribute("role", "button");

                    const number = document.createElement("span");
                    number.className = "essay-number";
                    number.textContent = `REDAÇÃO ${String(originalIndex + 1).padStart(2, "0")}`;

                    const score = document.createElement("div");
                    score.className = "essay-score";
                    score.textContent = essay.score;

                    const theme = document.createElement("h3");
                    theme.textContent = essay.theme;

                    const instruction = document.createElement("p");
                    instruction.className = "essay-instruction";
                    instruction.textContent = "Clique para ler a redação →";

                    card.append(number, score, theme, instruction);
                    card.addEventListener("click", () => openModal(essay, originalIndex));
                    card.addEventListener("keydown", event => {
                        if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            openModal(essay, originalIndex);
                        }
                    });

                    essayGrid.appendChild(card);
                });
            }

            // Evento para a barra de pesquisa
            if (essaySearch) {
                essaySearch.addEventListener("input", event => {
                    renderEssays(event.target.value, currentSort);
                });
            }

            // Eventos para os botões de ordenação
            sortButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    sortButtons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentSort = btn.getAttribute("data-sort");
                    const searchTerm = essaySearch ? essaySearch.value : "";
                    renderEssays(searchTerm, currentSort);
                });
            });

            if (modalClose) modalClose.addEventListener("click", closeModal);
            if (modal) {
                modal.addEventListener("click", event => {
                    if (event.target === modal) closeModal();
                });
            }
            document.addEventListener("keydown", event => {
                if (event.key === "Escape") closeModal();
            });

            // Renderiza inicialmente
            renderEssays("", "default");
        });
    </script>
